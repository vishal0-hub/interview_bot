{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Interview Bot{% endblock %}</title>
    <meta name="description" content="AI-powered resume interview bot that generates technical questions and provides analysis reports">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'interview/css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-wrapper">
        <nav class="navbar">
            <a href="{% url 'home' %}" class="nav-brand">
                <span class="brand-icon">🤖</span>
                <span class="brand-text">InterviewAI</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'upload_resume' %}" class="nav-link">New Interview</a>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <p>Powered by Google Gemini AI • Built with Django</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
